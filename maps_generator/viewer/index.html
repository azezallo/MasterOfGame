<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master of Game - Map Viewer</title>
    <!-- ПРИМІТКА: Цей DOM-viewer призначений виключно для тестування невеликих карт. Для великих карт використовуйте SVG viewer-и (svg_map.html). -->
    <style>
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #ddd;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 0;
        }
        #controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
            display: flex;
            gap: 20px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #map-container {
            /* This will be configured dynamically via JS to use CSS Grid */
            display: grid;
            gap: 0; /* No gaps between tiles */
            border: 2px solid #555;
            background: #000;
        }
        .tile {
            /* Tile size, can be adjusted for zoom */
            width: 8px;
            height: 8px;
        }
        /* Hover effect for tiles */
        .tile:hover {
            outline: 1px solid red;
            z-index: 10;
        }
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>Генератор світу - Етап 1</h1>
    
    <div id="controls">
        <div class="control-group">
            <label><input type="radio" name="layer" id="layer-elevation" value="elevation"> Висота (Grayscale)</label>
            <label><input type="radio" name="layer" value="temperature"> Температура</label>
            <label><input type="radio" name="layer" value="moisture"> Вологість</label>
            <label><input type="radio" name="layer" value="biomes" checked> Біоми</label>
            <label><input type="radio" name="layer" value="political"> Політична</label>
        </div>
        <div class="control-group" style="margin-top: 10px;">
            <label><input type="checkbox" id="layer-rivers" checked> Показати річки та озера</label>
            <label style="margin-left: 20px;"><input type="checkbox" id="layer-magic"> Магічне Поле</label>
            <input type="range" id="magic-opacity" min="0" max="1" step="0.05" value="0.7" style="vertical-align: middle;">
        </div>
    </div>

    <div id="map-container"></div>
    <div id="tooltip"></div>

    <!-- Підключаємо згенеровані дані -->
    <script src="../out/map_data.js"></script>
    <!-- Підключаємо логіку рендеру -->
    <script src="app.js"></script>
</body>
</html>
