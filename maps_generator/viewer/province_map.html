<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Province Map Viewer</title>
    <style>
        body { margin: 0; padding: 0; background: #222; overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #toolbar { background: #333; color: white; padding: 10px; display: flex; gap: 20px; align-items: center; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        #map-container { flex: 1; overflow: auto; position: relative; cursor: grab; }
        #map-container:active { cursor: grabbing; }
        
        #map-svg {
            transform-origin: 0 0;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            font-size: 14px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            max-width: 250px;
        }
        
        .settlement {
            cursor: pointer;
        }
        .settlement:hover {
            stroke: rgba(255, 215, 0, 0.8);
            stroke-width: 2px;
        }
        
        button {
            padding: 5px 10px;
            background: #555;
            color: white;
            border: 1px solid #777;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="history.back()">← Назад</button>
        <button onclick="window.location.href='svg_map.html'">До Глобальної Мапи</button>
        <div>
            <label>Зум: <input type="range" id="zoom-slider" min="0.1" max="3" step="0.1" value="1.0"></label>
            <span id="zoom-value">100%</span>
        </div>
        <div id="province-title" style="font-weight: bold; margin-left: auto;"></div>
    </div>
    
    <div id="map-container">
        <!-- SVG will be injected here -->
    </div>
    <div id="tooltip" class="tooltip"></div>

    <script src="lib/panZoom.js"></script>
    <script src="province_app.js"></script>
</body>
</html>
