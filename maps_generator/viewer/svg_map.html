<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG Map Viewer</title>
    <style>
        body { margin: 0; padding: 0; background: #222; overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #toolbar { background: #333; color: white; padding: 10px; display: flex; gap: 20px; align-items: center; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        #map-container { flex: 1; overflow: auto; position: relative; cursor: grab; }
        #map-container:active { cursor: grabbing; }
        
        #map-svg {
            transform-origin: 0 0;
            /* width and height will be set dynamically */
        }
        
        .faction-polygon {
            fill-opacity: 0.3; /* 70% transparent */
            stroke: none; /* No hatch or grid lines */
            transition: fill-opacity 0.2s;
            cursor: pointer;
        }
        .faction-polygon:hover {
            fill-opacity: 0.5;
        }
        
        .road {
            fill: none;
            stroke: #5c3a21;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.6;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            font-size: 14px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            max-width: 250px;
        }
        
        .settlement {
            cursor: pointer;
        }
        .settlement:hover {
            filter: drop-shadow(0 0 5px gold);
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div>
            <label>Зум: <input type="range" id="zoom-slider" min="0.1" max="2" step="0.1" value="0.5"></label>
            <span id="zoom-value">50%</span>
        </div>
        <div>
            <label><input type="checkbox" id="show-borders" checked> Кордони фракцій</label>
        </div>
    </div>
    
    <div id="map-container">
        <!-- SVG will be injected here -->
    </div>
    <div id="tooltip" class="tooltip"></div>

    <!-- Підключаємо згенеровані дані -->
    <script src="../out/global_map_data.js"></script>
    <script src="svg_app.js"></script>
</body>
</html>
